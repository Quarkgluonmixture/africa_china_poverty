# Conda environment for the PyTorch rebuild.
#   conda env create -f environment.yml && conda activate acp
# Then install the GPU-matched PyTorch build (see requirements.txt note), e.g.
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
name: acp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - timm>=1.0.0
      - numpy>=1.26
      - pandas>=2.0
      - scikit-learn>=1.3
      - scipy>=1.11
      - matplotlib>=3.7
      - Pillow>=10.0
      - pyyaml>=6.0
      - tqdm>=4.65
      # PyTorch: install separately to match your GPU/arch, e.g.
      # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
